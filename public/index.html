<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Silvermax</title>
<style id="css">
:root{--bg:#f6f8fb;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--ac:#2563eb;--ac2:#0ea5e9;--warn:#fef3c7;--warnb:#f59e0b;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--fg:#e8edf6;--mut:#94a3b8;--card:#131c2e;--bd:#233049;--warn:#3a2d0a}}
:root[data-theme=dark]{--bg:#0b1220;--fg:#e8edf6;--mut:#94a3b8;--card:#131c2e;--bd:#233049;--warn:#3a2d0a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}.w{max-width:1040px;margin:auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;text-decoration:none;color:var(--fg)}.logo b{color:var(--ac)}
nav a.l{margin-left:18px;color:var(--mut);text-decoration:none;font-size:14px}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#0ea5e9);color:#fff;border-radius:24px;padding:48px 28px;margin-top:8px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0 0 12px;letter-spacing:-1px}.hero p{opacity:.85;max-width:560px;margin:0 0 24px}
.tf{display:flex;gap:8px;flex-wrap:wrap;max-width:560px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%}
.tf input{flex:1;min-width:200px;width:auto;color:#0f172a;background:#fff}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 20px;background:var(--ac);color:#fff;cursor:pointer}
.btn2{background:transparent;color:var(--fg);border:1px solid var(--bd)}.dng{background:#dc2626}
h2{font-size:26px;letter-spacing:-.5px;margin:44px 0 16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px}.c h3{margin:6px 0}.c p{color:var(--mut);margin:0}
.ic{font-size:28px}
.res{margin-top:20px}.badge{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--ac);color:#fff;font-size:13px;font-weight:600}
.bar{display:flex;margin:26px 0 8px}.st{flex:1;text-align:center;position:relative;font-size:12px;color:var(--mut)}
.st:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:4px;background:var(--bd)}.st:first-child:before{display:none}
.st.on:before{background:var(--ac)}.dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--bd);margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-size:13px}
.st.on .dot{background:var(--ac)}.st.cur .dot{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 25%,transparent)}.st.cur{color:var(--fg);font-weight:600}
.warn{background:var(--warn);border:1px solid var(--warnb);border-radius:16px;padding:18px;margin:18px 0}.warn h3{margin:0 0 6px}.warn pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}
.kv{color:var(--mut);font-size:13px}.tl{border-left:2px solid var(--bd);margin:8px 0 0 6px;padding-left:16px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.route{display:flex;align-items:center;gap:12px;font-weight:600;flex-wrap:wrap}.route i{flex:1;min-width:30px;border-top:2px dashed var(--bd)}
footer{margin:56px 0 24px;color:var(--mut);font-size:14px;text-align:center}
.tabs{display:flex;gap:8px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.f label{font-size:13px;color:var(--mut);display:block}.f .full{grid-column:1/-1}
.pb{position:sticky;bottom:0;background:var(--ac);color:#fff;padding:12px 16px;border-radius:14px;margin:16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.pb button{background:#fff;color:var(--ac)}
.stat{font-size:30px;font-weight:800;color:var(--ac)}.btn{text-decoration:none;display:inline-block}
nav{gap:8px;flex-wrap:wrap}.mb{display:none;background:transparent;color:var(--fg);border:1px solid var(--bd);padding:6px 14px;font-size:18px}
@media(max-width:640px){.mb{display:block}.nl{display:none;width:100%;flex-direction:column}.nl.open{display:flex}.nl a.l{margin:0;padding:12px 0;border-top:1px solid var(--bd)}}
@media(max-width:560px){.st{font-size:10px}}
</style></head><body><div class="w" id="root"></div>
<script id="app">
const $=s=>document.querySelector(s),R=$('#root');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={site:null,ships:[]};
const ST=['Order Received','Picked Up','In Transit','Custom Clearance','Out for Delivery','Delivered'];
let art=null,tab='s',ed=null,found=undefined,dirty=0,q='';
let PW='';try{PW=sessionStorage.getItem('smxp')||''}catch(x){}
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()};
let msg='';
const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({site:S.site,ships:S.ships},null,2)],{type:'application/json'}));a.download='db.json';a.click()};
async function save(){msg='Saving...';admin();try{const r=await api('/api/admin',{action:'save',password:PW,data:{site:S.site,ships:S.ships}});dirty=0;msg=r.committed?'Saved. Your site redeploys automatically (about 1 minute).':'Downloaded db.json. Replace data/db.json in your project with it and redeploy.';if(!r.committed)dl()}catch(x){msg='Save failed: '+x.message}admin()}
async function adminEntry(){if(auth)return admin();if(!PW)return login();try{const d=await api('/api/admin',{action:'get',password:PW});S.site=d.site;S.ships=d.ships;auth=true;admin()}catch(x){PW='';login()}}
const today=()=>new Date().toISOString().slice(0,10);
const nav=()=>`<nav><a class="logo" href="#/">${e(S.site.brand.split(' ')[0].slice(0,-3))}<b>${e(S.site.brand.split(' ')[0].slice(-3))}</b> ${e(S.site.brand.split(' ').slice(1).join(' '))}</a><button class="mb" id="mb" aria-label="Menu">☰</button><span class="nl" id="nl"><a class="l" href="#/">Home</a><a class="l" href="#/about">About</a><a class="l" data-s="svc" href="#/">Services</a><a class="l" data-s="track" href="#/">Track</a><a class="l" data-s="contact" href="#/">Contact</a></span></nav>`;
function wire(){const m=$('#mb');if(m)m.onclick=()=>$('#nl').classList.toggle('open');document.querySelectorAll('[data-s]').forEach(a=>a.onclick=ev=>{ev.preventDefault();$('#nl')?.classList.remove('open');const f=()=>document.getElementById(a.dataset.s)?.scrollIntoView({behavior:'smooth'});if(location.hash==='#/'||!location.hash)f();else{location.hash='#/';setTimeout(f,60)}})}
const ft=()=>`<footer>© ${new Date().getFullYear()} ${e(S.site.brand)}. All rights reserved.</footer>`;
let auth=false;
const lst=t=>t.split('\n').filter(x=>x.trim()).map(l=>l.split('|'));
function about(){const s=S.site;R.innerHTML=`<div class="w">${nav()}<h2 style="margin-top:12px">About ${e(s.brand)}</h2><div class="c"><p style="color:var(--fg);white-space:pre-line">${e(s.about)}</p></div><div class="g" style="margin-top:14px">${lst(s.stats).map(([a,b])=>`<div class="c"><div class="stat">${e(a)}</div><p>${e(b)}</p></div>`).join('')}</div><h2>What we offer</h2><div class="g">${lst(s.features).map(([a,b,c])=>`<div class="c"><div class="ic">${e(a)}</div><h3>${e(b)}</h3><p>${e(c)}</p></div>`).join('')}</div><h2>Get in touch</h2><div class="c"><p>✉️ ${e(s.email)} &nbsp; 📞 ${e(s.phone)}<br>📍 ${e(s.addr)}</p></div>${ft()}</div>`;wire()}
function login(){R.innerHTML=`<div class="w">${nav()}<div class="c" style="max-width:380px;margin:40px auto"><h2 style="margin:0 0 12px">Admin login</h2><form id="lf" class="f" style="grid-template-columns:1fr"><div><label>Password</label><input name="p" type="password"></div><p id="le" style="color:#dc2626;margin:0"></p><button>Sign in</button></form></div></div>`;wire();$('#lf').onsubmit=async ev=>{ev.preventDefault();const p=new FormData(ev.target).get('p');try{const d=await api('/api/admin',{action:'get',password:p});PW=p;try{sessionStorage.setItem('smxp',p)}catch(x){}S.site=d.site;S.ships=d.ships;auth=true;admin()}catch(x){$('#le').textContent='Incorrect password'}}}
function home(){const s=S.site;
const sv=s.services.split('\n').filter(x=>x.trim()).map(l=>{const[a,b,c]=l.split('|');return`<div class="c"><div class="ic">${e(a)}</div><h3>${e(b)}</h3><p>${e(c)}</p></div>`}).join('');
R.innerHTML=`<div class="w">${nav()}
<div class="hero" id="track"><h1>${e(s.title)}</h1><p>${e(s.sub)}</p><form class="tf" id="tf"><input id="q" placeholder="Enter tracking code e.g. SMX-100200" value="${e(q)}" autocomplete="off"><button>Track shipment</button></form></div>
<div class="res" id="res"></div>
<h2 id="svc">Our services</h2><div class="g">${sv}</div>
<h2>Consignment features</h2><div class="g">${lst(s.features).map(([a,b,c])=>`<div class="c"><div class="ic">${e(a)}</div><h3>${e(b)}</h3><p>${e(c)}</p></div>`).join('')}</div>
<h2 id="est">Shipping cost estimator</h2><div class="c"><form class="f" id="ef"><div><label>Weight (kg)</label><input name="w" type="number" min="0.1" step="0.1" required></div><div><label>Service</label><select name="sv"><option value="4">Express</option><option value="2.5">Air freight</option><option value="1.2">Sea freight</option></select></div><div><label>Destination</label><select name="z"><option value="1">Within country</option><option value="2">Africa</option><option value="3.5">Europe / Asia</option><option value="4.5">Americas / Oceania</option></select></div><div style="align-self:end"><button>Calculate</button></div></form><h3 id="eo"></h3></div>
<h2 id="contact">Contact us</h2><div class="c"><p>✉️ ${e(s.email)} &nbsp; 📞 ${e(s.phone)}<br>📍 ${e(s.addr)}</p></div>
${ft()}</div>`;
$('#tf').onsubmit=async ev=>{ev.preventDefault();q=$('#q').value.trim();try{found=(await api('/api/track?code='+encodeURIComponent(q))).ship}catch(x){found=null}result()};
wire();$('#ef').onsubmit=ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));$('#eo').innerHTML='Estimated cost: $'+(5+d.w*d.sv*d.z).toFixed(2)+' <span class="kv">(estimate only; final price confirmed at pickup)</span> <a class="btn" href="mailto:'+e(s.email)+'?subject=Pickup%20request">Request pickup</a>'};
if(found!==undefined)result()}
function result(){const r=$('#res');if(!found){r.innerHTML=`<div class="c"><h3>No shipment found</h3><p>We couldn't find a shipment with the code "${e(q)}". Please check the code and try again.</p></div>`;return}
const x=found,i=Math.max(0,ST.indexOf(x.status));
const bar=ST.map((n,k)=>`<div class="st ${k<=i?'on':''} ${k==i?'cur':''}"><div class="dot">${k<i?'✓':k+1}</div>${n}</div>`).join('');
const cc=x.status==='Custom Clearance'?`<div class="warn"><h3>⚠️ Payment required: customs clearance</h3><p style="margin:0">Your shipment is held at customs.${x.fee?` Amount due: <b>${e(x.fee)}</b>.`:''} Please make payment to continue delivery.</p><pre>${e(x.pay)}</pre></div>`:'';
r.innerHTML=`<div class="c"><div class="row" style="border:0"><div><div class="kv">Tracking code</div><h2 style="margin:0">${e(x.code)}</h2></div><span class="badge">${e(x.status)}</span></div>
<div class="bar">${bar}</div>
<div class="route"><span>${e(x.from)}</span><i></i><span>📍 ${e(x.loc)}</span><i></i><span>${e(x.to)}</span></div>${cc}
<div class="g" style="margin-top:18px"><div class="c"><div class="kv">SENDER</div><b>${e(x.sn)}</b><p>${e(x.sa)}</p></div><div class="c"><div class="kv">RECEIVER</div><b>${e(x.rn)}</b><p>${e(x.ra)}</p></div>
<div class="c"><div class="kv">DETAILS</div><p>${e(x.desc)}<br>Weight: ${e(x.wt)}<br>Est. delivery: ${e(x.eta)}</p></div></div>
<h3>Shipment history</h3><div class="tl">${[...x.hist].reverse().map(h=>`<div><b>${e(h.s)}</b> · ${e(h.l)}<div class="kv">${e(h.t)}</div></div>`).join('')}</div></div>`;r.scrollIntoView({behavior:'smooth',block:'nearest'})}
const fld=(k,l,v,t)=>`<div><label>${l}</label><input name="${k}" value="${e(v)}" ${t||''}></div>`;
function admin(){if(!auth)return login();const s=S.site;let b='';
if(tab==='s'){if(ed===null)b=`<button id="new">+ New shipment</button>${S.ships.map((x,k)=>`<div class="row"><div><b>${e(x.code)}</b> <span class="badge">${e(x.status)}</span><div class="kv">${e(x.sn)} → ${e(x.rn)} · ${e(x.loc)}</div></div><div><button class="btn2" data-e="${k}">Edit</button> <button class="dng" data-d="${k}">Delete</button></div></div>`).join('')||'<p>No shipments yet.</p>'}`;
else{const x=ed>=0?S.ships[ed]:{code:'SMX-'+Math.floor(100000+Math.random()*900000),status:'Order Received',loc:'',from:'',to:'',eta:'',desc:'',wt:'',fee:'',sn:'',sa:'',rn:'',ra:''};
b=`<form id="sf" class="f">${fld('code','Tracking code',x.code,'required')}<div><label>Status</label><select name="status">${ST.map(t=>`<option ${t==x.status?'selected':''}>${t}</option>`).join('')}</select></div>${fld('loc','Current location',x.loc)}${fld('from','Origin',x.from)}${fld('to','Destination',x.to)}${fld('eta','Estimated delivery',x.eta,'type="date"')}${fld('desc','Package description',x.desc)}${fld('wt','Weight',x.wt)}${fld('fee','Clearance fee due (shown on Custom Clearance)',x.fee)}${fld('sn','Sender name',x.sn)}${fld('sa','Sender address',x.sa)}${fld('rn','Receiver name',x.rn)}${fld('ra','Receiver address',x.ra)}<div class="full"><button>Save shipment</button> <button type="button" class="btn2" id="cx">Cancel</button></div></form>`}}
else b=`<form id="cf" class="f">${fld('brand','Brand name',s.brand)}${fld('title','Hero headline',s.title)}<div class="full"><label>Hero subtext</label><textarea name="sub" rows="2">${e(s.sub)}</textarea></div><div class="full"><label>Services (one per line: icon|title|description)</label><textarea name="services" rows="7">${e(s.services)}</textarea></div><div class="full"><label>Payment instructions (shown on Custom Clearance)</label><textarea name="pay" rows="6">${e(s.pay)}</textarea></div><div class="full"><label>About us text</label><textarea name="about" rows="5">${e(s.about)}</textarea></div><div class="full"><label>About stats (value|label per line)</label><textarea name="stats" rows="3">${e(s.stats)}</textarea></div><div class="full"><label>Consignment features (icon|title|description per line)</label><textarea name="features" rows="4">${e(s.features)}</textarea></div>${fld('email','Email',s.email)}${fld('phone','Phone',s.phone)}${fld('addr','Address',s.addr)}<div class="full"><button>Apply changes</button></div></form>`;
R.innerHTML=`<div class="w"><nav><a class="logo" href="#/">← ${e(s.brand)}</a><span><button class="btn2" id="sync">Save &amp; publish</button> <button class="btn2" id="lo">Log out</button></span></nav>
<div class="tabs"><button class="${tab=='s'?'':'btn2'}" data-t="s">Shipments</button><button class="${tab=='c'?'':'btn2'}" data-t="c">Website content</button></div>
${msg?`<p class="kv">${e(msg)}</p>`:''}<div class="c">${b}</div>${dirty?`<div class="pb"><span>${dirty} unsaved change(s)</span><button id="pub">Publish to live site</button></div>`:''}</div>`;
document.querySelectorAll('[data-t]').forEach(a=>a.onclick=()=>{tab=a.dataset.t;ed=null;admin()});
const g=(i,f)=>{const n=$(i);if(n)n.onclick=f};g('#new',()=>{ed=-1;admin()});g('#cx',()=>{ed=null;admin()});g('#pub',save);g('#sync',save);g('#lo',()=>{auth=false;PW='';try{sessionStorage.removeItem('smxp')}catch(x){}login()});
document.querySelectorAll('[data-e]').forEach(a=>a.onclick=()=>{ed=+a.dataset.e;admin()});
document.querySelectorAll('[data-d]').forEach(a=>a.onclick=()=>{if(confirm('Delete this shipment?')){S.ships.splice(+a.dataset.d,1);dirty++;admin()}});
if($('#sf'))$('#sf').onsubmit=ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));d.code=d.code.trim();const o=ed>=0?S.ships[ed]:null;
const h=o?o.hist:[];if(!o||o.status!==d.status||o.loc!==d.loc)h.push({t:today(),s:d.status,l:d.loc});d.hist=h;
if(o)S.ships[ed]=d;else S.ships.unshift(d);ed=null;dirty++;admin()};
if($('#cf'))$('#cf').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));Object.assign(S.site,d);dirty++;admin()}}
const isAdm=()=>/^\/admin\/?$/.test(location.pathname)||location.hash==='#/admin'||location.hash==='#admin';
function route(){isAdm()?adminEntry():location.hash==='#/about'?about():home()}
addEventListener('hashchange',()=>{if(/^#\/?(admin|about)?$|^#admin$/.test(location.hash))route()});
api('/api/site').then(j=>{S.site=j;route()}).catch(()=>{R.textContent='Unable to load site.'});
</script></body></html>
